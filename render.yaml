services:
  - type: web
    name: arise-ai-teacher-assistant
    runtime: node
    plan: free
    buildCommand: npm install && mkdir -p public && cp index.html public/index.html
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
